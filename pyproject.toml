# pip install -e ".[dev]"
# pip install -e ".[local-rerank]"
# pip install -e ".[dev,local-rerank,pdf]"
[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-system-rag"
version = "0.1.0"
description = "Legal RAG system for German tenancy law documents"
requires-python = ">=3.12"

authors = [
    { name = "Guangfa Wu" }
]

license = { text = "MIT" }

dependencies = [
    "certifi>=2024.7.4",
    "chromadb>=0.5.0",
    "huggingface_hub>=0.20.0",
    "httpx>=0.25.0",
    "langchain>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.30.0",
    "tenacity>=9.0.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-anyio>=0.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.0.0",
    "pytest-cov",
]

#pdf = [
#    "pypdf>=4.0.0",
#]

# OPTIONAL: Falls du lokal weiterhin FlashRank testen möchtest
#local-rerank = [
#    "flashrank>=0.2.0",
#]

[project.scripts]
legal-ingest = "legal_system_rag.ingest_documents:main"
legal-app = "legal_system_rag.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]

# Pytest-Standardverhalten inklusive Branch Coverage
addopts = "-v --import-mode=importlib --cov=src --cov-branch --cov-report=term-missing --cov-report=html"

# Ignoriere optionale Torchvision/PyTorch-Warnungen bei Testläufen
filterwarnings = [
    "ignore::UserWarning:torchvision.*",
    "ignore:Failed to load image Python extension.*:UserWarning",
]

# Registrierte Custom Markers
markers = [
    "unit: Unit tests without external dependencies",
    "integration: Integration tests using external services or infrastructure",
    "e2e: End-to-end tests covering the complete application workflow",
    "proxy: Tests requiring a local NTLM Px proxy instance",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]





